name: Configure Sonar CI analysis
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Switch the existing project to CI analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error \
            --user "$SONAR_TOKEN:" \
            --request POST \
            --data-urlencode 'projectKey=brivalmont_hello-world' \
            --data-urlencode 'enable=false' \
            'https://dev9.sc-dev9.io/api/autoscan/activation'
